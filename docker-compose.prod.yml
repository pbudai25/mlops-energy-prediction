services:
  mlflow-energy:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: mlflow-energy

    ports:
      - "5000:5000"

    volumes:
      - .:/mlflow:z

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/mlruns
      - --serve-artifacts
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000,mlflow-energy:5000,mlflow-energy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/version')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: ghcr.io/pbudai25/mlops-energy-prediction:${IMAGE_TAG:-latest}

    container_name: energy-prediction-api

    ports:
      - "8001:8000"

    volumes:
      - .:/mlflow:z

    environment:
      LOAD_MLFLOW_MODEL: "true"
      MLFLOW_TRACKING_URI: "http://mlflow-energy:5000"

    depends_on:
      mlflow-energy:
        condition: service_healthy

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - --config.file=/etc/prometheus/prometheus.yml

    depends_on:
      - api

    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  grafana-data:

networks:
  default:
    name: mlops-network
